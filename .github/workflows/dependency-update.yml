name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  composer-update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'

    - name: Check for outdated Composer packages
      run: composer outdated --direct

    - name: Update Composer dependencies
      run: composer update --dry-run
      continue-on-error: true

  npm-update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '16.x'

    - name: Check for outdated npm packages
      run: npm outdated || true

    - name: Generate dependency update report
      run: |
        echo "# Dependency Update Report" > update-report.md
        echo "## Composer Packages" >> update-report.md
        composer outdated --direct >> update-report.md || true
        echo "" >> update-report.md
        echo "## NPM Packages" >> update-report.md
        npm outdated >> update-report.md || true

    - name: Upload report
      uses: actions/upload-artifact@v3
      with:
        name: dependency-update-report
        path: update-report.md
        retention-days: 30
