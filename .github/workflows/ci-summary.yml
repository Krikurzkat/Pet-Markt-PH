name: CI Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  summary:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Generate PR Summary
      run: |
        echo "# CI/CD Summary for PR #${{ github.event.pull_request.number }}" > summary.md
        echo "" >> summary.md
        echo "## 📊 Pull Request Information" >> summary.md
        echo "- **Title:** ${{ github.event.pull_request.title }}" >> summary.md
        echo "- **Author:** @${{ github.event.pull_request.user.login }}" >> summary.md
        echo "- **Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`" >> summary.md
        echo "- **Commits:** ${{ github.event.pull_request.commits }}" >> summary.md
        echo "" >> summary.md
        echo "## 🔍 Files Changed" >> summary.md
        echo "- **Changed Files:** ${{ github.event.pull_request.changed_files }}" >> summary.md
        echo "- **Additions:** +${{ github.event.pull_request.additions }}" >> summary.md
        echo "- **Deletions:** -${{ github.event.pull_request.deletions }}" >> summary.md
        echo "" >> summary.md
        echo "## ✅ Required Checks" >> summary.md
        echo "The following workflows must pass before merging:" >> summary.md
        echo "- [ ] Laravel Tests" >> summary.md
        echo "- [ ] Code Quality" >> summary.md
        echo "- [ ] Frontend Build" >> summary.md
        echo "- [ ] Lint" >> summary.md
        echo "" >> summary.md
        echo "## 📝 Review Checklist" >> summary.md
        echo "Please ensure:" >> summary.md
        echo "- [ ] Code follows project conventions" >> summary.md
        echo "- [ ] Tests are added/updated" >> summary.md
        echo "- [ ] Documentation is updated" >> summary.md
        echo "- [ ] No breaking changes (or documented)" >> summary.md
        echo "" >> summary.md
        echo "---" >> summary.md
        echo "*Auto-generated by CI Summary workflow*" >> summary.md
    
    - name: Comment PR
      uses: actions/github-script@v6
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
